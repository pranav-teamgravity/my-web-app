<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyApp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Splash -->
  <div id="splash" class="splash">
    <div class="logo">
      <h1>MyApp</h1>
      <p>Loading...</p>
    </div>
  </div>

  <!-- App Container -->
  <div id="app" class="hidden">

    <!-- Header -->
    <header class="header">
      <button id="backBtn" class="back-btn hidden">⬅</button>
      <h2 id="pageTitle">Home</h2>
    </header>

    <!-- Pages -->
    <main class="content">

      <div id="home" class="page">
        <div class="cards">
          <div class="card" data-page="page1">Card 1</div>
          <div class="card" data-page="page2">Card 2</div>
          <div class="card" data-page="page3">Card 3</div>
        </div>
      </div>

      <div id="page1" class="page hidden">
        <p>This is Page 1 content.</p>
      </div>

      <div id="page2" class="page hidden">
        <p>This is Page 2 content.</p>
      </div>

      <div id="page3" class="page hidden">
        <p>This is Page 3 content.</p>
      </div>

      <div id="search" class="page hidden">
        <p>Search page content.</p>
      </div>

      <div id="favorites" class="page hidden">
        <p>Favorites page content.</p>
      </div>

      <div id="settings" class="page hidden">
        <p>Settings page content.</p>
      </div>

    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <button data-page="home" class="nav-item active">🏠</button>
      <button data-page="search" class="nav-item">🔍</button>
      <button data-page="favorites" class="nav-item">❤️</button>
      <button data-page="settings" class="nav-item">⚙️</button>
    </nav>

  </div>

  <script src="script.js"></script>
</body>
</html>
